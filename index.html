<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary Meta Tags -->
    <title>Season Slice Cafe | Premium Coffee & Cozy Cafe Experience</title>
    <meta name="description" content="Visit Season Slice Cafe for handcrafted coffee, delicious desserts, breakfast specials, and a relaxing cafe atmosphere perfect for coffee lovers.">
    <!-- Theme Color -->
    <meta name="theme-color" content="#3C2415" />
    <!-- Preload critical fonts -->
    <link rel="preload" as="font" href="/fonts/Inter-Latin.woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/PlayfairDisplay-Latin.woff2" crossorigin />
    <!-- Preload LCP hero image -->
    <link rel="preload" as="image" href="/images/cakes/27%20Fantastic%20Summer%20Cake%20Ideas.webp" fetchpriority="high" />
    <!-- Preload critical SVG assets -->
    <link rel="preload" as="image" href="/icons.svg" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.seasonslice.com/">
    <meta property="og:title" content="Season Slice Cafe | Premium Coffee & Cozy Cafe Experience">
    <meta property="og:description" content="Visit Season Slice Cafe for handcrafted coffee, delicious desserts, breakfast specials, and a relaxing cafe atmosphere perfect for coffee lovers.">
    <meta property="og:image" content="https://www.seasonslice.com/cake-blueberry.png">
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.seasonslice.com/">
    <meta property="twitter:title" content="Season Slice Cafe | Premium Coffee & Cozy Cafe Experience">
    <meta property="twitter:description" content="Visit Season Slice Cafe for handcrafted coffee, delicious desserts, breakfast specials, and a relaxing cafe atmosphere perfect for coffee lovers.">
    <meta property="twitter:image" content="https://www.seasonslice.com/cake-blueberry.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Season Slice Cafe",
      "image": [
        "https://www.seasonslice.com/cake-blueberry.png",
        "https://www.seasonslice.com/cake-chocolate.png",
        "https://www.seasonslice.com/cake-matcha.png"
      ],
      "@id": "https://www.seasonslice.com/",
      "url": "https://www.seasonslice.com/",
      "telephone": "+91 70211 85010",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "The Baya Junction, Cross, Shop no 8 Pestom Sagar Rd Number 6",
        "addressLocality": "Chembur West",
        "addressRegion": "Maharashtra",
        "postalCode": "400089",
        "addressCountry": "IN"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "09:00",
          "closes": "21:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Sunday",
          "opens": "10:00",
          "closes": "20:00"
        }
      ],
      "menu": "https://www.seasonslice.com/menu",
      "servesCuisine": ["Coffee Shop","Bakery","Desserts","Breakfast & Brunch"]
    }
    </script>
    <style>
      *,::after,::before{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{font-family:'Inter',sans-serif;background-color:#F5F0E8;color:#3C2415;overflow-x:hidden}
      h1,h2,h3,h4,h5,h6{font-family:'Playfair Display',serif}
      #root{min-height:100vh}
      .fixed.top-0{z-index:100}
      button,a,.cursor-pointer{user-select:none;-webkit-user-select:none}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
